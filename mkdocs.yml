site_name: ccp-volume-em-guide
site_url: https://ccp-volume-em.github.io/guide/
site_description: Community best practice guide

repo_name: guide
repo_url: https://github.com/ccp-volume-em/guide

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - index.md
  - fair.md
  - green.md
  - software.md
  - software_publishing.md
  - plugins.md
  - plugin_testing.md
  - container_testing.md
  - ngff.md
  - muvis-align.md

theme:
  name: material
  logo: images/logo.png
  favicon: images/favicon.png
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
